<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nagarik Drishti</title>
  <meta name="description" content="Nagarik Drishti / नागरिक दृष्टि — See it. Report it. Track it. Fix it." />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#ffffff" />
  <script src="js/theme.js"></script>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/brand/favicon-32.png" />
  <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="track">
  <div id="site-header"></div>

  <main id="main-content">
    <div class="wide-page stack">
      <div>
        <h1 data-i18n="trk.h1"></h1>
        <p class="lead" data-i18n="trk.lead"></p>
      </div>

      <form id="track-form" class="card track-form" novalidate>
        <div class="field">
          <label for="track-ref" data-i18n="trk.ref"></label>
          <input id="track-ref" type="text" autocomplete="off" maxlength="30" placeholder="ND-2026-00001" />
        </div>
        <button type="submit" class="btn btn-primary" data-i18n="trk.btn"></button>
      </form>

      <div id="track-message" class="notice notice-error" role="alert" hidden data-i18n="trk.notfound"></div>
      <div id="track-result" aria-live="polite"></div>

      <section>
        <h2 style="font-size:1.05rem;margin:0" data-i18n="trk.mine"></h2>
        <ul id="mine-list" class="mine-list"></ul>
        <p id="mine-empty" class="hint" data-i18n="trk.mine.none"></p>
      </section>

      <section>
        <h2 style="font-size:1.05rem;margin:0" data-i18n="trk.recent"></h2>
        <ul id="recent-list" class="mine-list"></ul>
      </section>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="js/translations.js"></script>
  <script src="js/translations-reports.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/nepal-data.js"></script>
  <script src="js/config.js"></script>
  <script src="js/live-text.js"></script>
  <script src="js/demo-store.js"></script>
  <script src="js/store.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/track.js"></script>
</body>
</html>
