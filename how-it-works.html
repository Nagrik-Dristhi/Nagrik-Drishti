<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nagarik Drishti</title>
  <meta name="description" content="Nagarik Drishti / नागरिक दृष्टि — See it. Report it. Track it. Fix it." />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#ffffff" />
  <script src="js/theme.js"></script>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/brand/favicon-32.png" />
  <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="how">
  <div id="site-header"></div>

  <main id="main-content">
    <div class="page">
      <h1 data-i18n="how.h1"></h1>
      <p data-i18n="how.lead"></p>

      <div class="card" style="margin-top:2rem">
        <h2 style="margin:0" data-i18n="how.lifecycle"></h2>
        <div class="badge-row">
          <span class="badge badge-neutral" data-i18n="status.reported"></span>
          <span class="badge badge-review" data-i18n="status.review"></span>
          <span class="badge badge-verified" data-i18n="status.verified"></span>
          <span class="badge badge-assigned" data-i18n="status.assigned"></span>
          <span class="badge badge-progress" data-i18n="status.progress"></span>
          <span class="badge badge-resolved" data-i18n="status.resolved"></span>
        </div>
      </div>

      <ol>
        <li data-i18n-html="how.s1"></li>
        <li data-i18n-html="how.s2"></li>
        <li data-i18n-html="how.s3"></li>
        <li data-i18n-html="how.s4"></li>
      </ol>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="js/translations.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/nepal-data.js"></script>
  <script src="js/config.js"></script>
  <script src="js/live-text.js"></script>
  <script src="js/demo-store.js"></script>
  <script src="js/store.js"></script>
  <script src="js/layout.js"></script>
</body>
</html>
